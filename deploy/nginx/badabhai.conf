# Installed copy: C:\nginx\conf\badabhai.conf
# Included from C:\nginx\conf\nginx.conf after ridershub.conf and ephimor.conf.
# Public TLS terminates here (Let's Encrypt). Uvicorn stays on 127.0.0.1:8000.
# IIS is not installed on this host; private archive is blocked on the public vhost.
# Operators open http://127.0.0.1:8000/operator/archive with a trusted local header.
#
# Requires http-level map (already in ridershub.conf on this host):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream badabhai_upstream {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen       80;
    server_name  badabhai.shreejientserv.in;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root         C:/Dev/BadaBhai/certs/webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    server_name  badabhai.shreejientserv.in;

    ssl_certificate     C:/nginx/conf/ssl/letsencrypt/badabhai.shreejientserv.in-chain.pem;
    ssl_certificate_key C:/nginx/conf/ssl/letsencrypt/badabhai.shreejientserv.in-key.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    # Never forward a client-supplied IIS identity into the app.
    proxy_set_header   X-IIS-User        "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Keep recordings/transcripts off the public hostname until Windows Auth exists.
    location ^~ /operator/archive {
        return 403;
    }
    location ^~ /api/private/ {
        return 403;
    }

    # Explicit WebSocket upgrade for live dashboard + Exotel telephony.
    location ^~ /api/live {
        proxy_pass http://badabhai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /ws {
        proxy_pass http://badabhai_upstream/api/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /exotel {
        proxy_pass http://badabhai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://badabhai_upstream;
    }
}
